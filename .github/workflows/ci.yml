name: Build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # Packages the presets as bootsmith-config. Nothing to compile, so the
  # lightweight profile: no EPICS toolchain and no rpm-repo container.
  build:
    uses: gemini-rtsw/gemini-rtsw-ci/.github/workflows/ci.yml@main
    secrets: inherit
    with:
      scripts_dir: gemini-rtsw-ci
      el_version: '9'
      profile: lightweight
      spec_path: bootsmith-config.spec

  # Rebuilds rpm-repo:latest once, after the build has pushed its scratch tag.
  publish:
    needs: build
    uses: gemini-rtsw/gemini-rtsw-ci/.github/workflows/publish.yml@main
    secrets: inherit
